<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CF0"/>
      <stop offset="1" stop-color="#4529A6"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <ellipse cx="512" cy="220" rx="520" ry="180" fill="#FFFFFF" opacity="0.06"/>

  <g filter="url(#shadow)">
    <!-- corpo da roleta -->
    <circle cx="512" cy="470" r="330" fill="#FDFCFF" stroke="#C9BFEF" stroke-width="12"/>
    <!-- bolsos alternados (8 segmentos) -->
    <circle cx="512" cy="470" r="245" fill="none" stroke="#FF6B5E" stroke-width="130"
            stroke-dasharray="192.42 192.42"/>
    <circle cx="512" cy="470" r="245" fill="none" stroke="#4A3AA0" stroke-width="130"
            stroke-dasharray="192.42 192.42" stroke-dashoffset="-192.42"/>
    <!-- bola em um bolso -->
    <circle cx="389" cy="682" r="26" fill="#FFFFFF" stroke="#4A3AA0" stroke-width="8"/>
    <!-- cubo central -->
    <circle cx="512" cy="470" r="120" fill="#FFFFFF" stroke="#C9BFEF" stroke-width="10"/>
    <circle cx="512" cy="470" r="46" fill="#4A3AA0"/>
    <circle cx="500" cy="455" r="14" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- ponteiro -->
  <polygon points="482,96 542,96 512,196" fill="#FFFFFF" stroke="#4A3AA0" stroke-width="10" stroke-linejoin="round"/>
</svg>